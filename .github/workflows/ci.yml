# Trading X CI — lives in the standalone trading-school repo (extracted from
# the XAUUSD monorepo via `git subtree split` so Meridian-7's proprietary
# strategy research never has to be part of any remote this repo pushes to).
# No path filter / working-directory needed here, unlike the old monorepo
# copy this supersedes — this repo's root IS the app root.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      SESSION_SECRET: "ci-only-session-secret-not-used-for-anything-real"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      # Next 16 generates the route type helpers (LayoutProps, PageProps,
      # RouteContext) into .next/types, which tsconfig.json includes. Those used
      # to appear only after `next dev`/`next build`, so a bare `tsc --noEmit`
      # in CI failed on app/layout.tsx's `LayoutProps<"/">` — which is why this
      # workflow had never gone green. `next typegen` generates them without a
      # full build; see node_modules/next/dist/docs/01-app/03-api-reference/
      # 06-cli/next.md, which documents exactly this CI pattern.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run test
